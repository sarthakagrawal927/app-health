        <h1>Privacy-first endpoint health</h1>
        <p>
          App Health shows the latency, error rate, throughput, and availability of observed service
          endpoints. Its Node, Go, Cloudflare, and OpenTelemetry adapters send normalized route
          summaries without request bodies, headers, cookies, query values, user identity, logs, or
          stack traces.
        </p>
        <h2>Connect one service, then inspect real endpoints</h2>
        <p>
          The owner dashboard separates environments and time windows, keeps successful requests
          aggregate-only, and exposes only bounded recent failure metadata. Product setup and
          telemetry remain authenticated; this public description contains no operator data.
